<script type="module">
/* ═══ RALLY COURT · a Multiplayer Agent starter ═════════════════════════════════════════════
 * Arcade tennis on a grass court. Singles, or doubles once 3 people are here; bots fill every
 * empty spot, so alone you play a bot. One set: first to 4 games, a tiebreak at 3–3, no-ad scoring.
 * Your player runs to the ball by itself (steer to take over). Timing is everything: swing early
 * and it goes cross-court, late and it goes down the line, right on time and it's a power shot.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ scoring, court size, ball physics, running, swing timing windows, serving, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the host's clock
 *   BALL .......... flights: bounces, the net, where a ball crosses you, where to stand for it (after the
 *                   bounce, or a volley up at the net), building shots and serves
 *   COURT ......... renderer, grass and lines, net, stands, crowd, players, ball, particles, sound
 *   MATCH (HOST) .. seats, serves, faults, in/out calls, points, games, the tiebreak, the winner
 *   BOTS .......... the bot brain: run to the ball, volley at the net, swing with a human-like timing error, serve
 *   ME ............ my player: auto-run + steering, my swing and my serve, judged on my screen
 *   VIEWS ......... other players and the bots, eased between writes
 *   DRAW .......... placing everyone, the ball, effects, the timing ring and the camera
 *   HUD & RESULTS . scoreboard, calls, the serve meter, results card, leaderboard
 *   INPUT ......... keyboard, and a thumb stick + SWING / LOB buttons on touch
 *   MAIN LOOP ..... one frame: host work, my player, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` {x, z, s} (its player on the court, s = when it last
 *     swung) about 12 times a second, `hb` (heartbeat) once a second, `n`/`c` once, `rdy` (Play again).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked out
 *     every frame. Only the host writes the shared fields:
 *       `game` {id, v, phase, teams, dbl, games, pts, tb, gn, ft, srv, pn, fault, sn, at, nx, call, st, best, win}:
 *              who plays on which side (sessionIds or bots "b1".."b4"), the score, who serves, the phase
 *              and its timer. `v` goes up on every write; `pn` counts points (everyone walks to their spot).
 *       `ball` {v, n, kind, f, pf, by, team, bx}: the ball's current flight `f` (start, velocity, start
 *              time) written ONCE per shot; every screen works out the arc, bounces and the net itself.
 *       `bots` [{id, x, z, s}]: the bots' players, ~12 times a second.   `clk`: the host's clock.
 *   - THE HITTER DECIDES ITS OWN SWING. Its screen measures the swing from the key or touch event
 *     itself, against the moment the ball reaches it, builds the shot and sends "hit" {n, kind, f, t};
 *     the host checks it is the right side and the right ball, clamps it, and writes it as the new
 *     `ball`. The server sends "toss" {} then "hit" with kind "serve". The host plays every bot.
 *   - The host calls every bounce from the flight: out, net, fault, a second bounce (a winner).
 *     A new host adopts `game`, `ball` and `bots` and carries on from the same timestamps. A host whose
 *     tab froze stops hosting, waits 0.7s for fresh state, then adopts it, so it never writes old state.
 *   - Someone who joins takes a bot's spot (a third person starts a fresh doubles match); someone
 *     who leaves is replaced by a bot.
 *   - ?attract plays offline, bots only, doubles (the preview video is recorded from it).
 *   - Leaderboard "longest-rally": the longest rally (shots) each player has played in.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  gamesToWin: 4,          // first to this many games wins the match
  tiebreakTo: 7,          // at 3–3 in games a tiebreak: first to 7 points, by 2
  noAd: true,             // at 40–40 the next point wins the game
  doublesFrom: 3,         // with this many people here it's two a side
  introMs: 2400,          // "PLAY!" before the first serve
  serveClockMs: 9000,     // a person has this long to serve (then it serves for you)
  botServeMs: 1100,       // a bot waits this long before it tosses
  pointMs: 1900,          // the call after a point stays up this long
  faultMs: 1100,          // ...after a fault
  resultsMs: 15000,       // the results card before the next match (Play again skips it)
  // The court in metres (real proportions). x runs across, z along; the net is z = 0.
  halfL: 11.89, singlesW: 4.115, doublesW: 5.485, serviceL: 6.4, netH: 0.95,
  gravity: 9.8,           // pulls the ball down, m/s²
  bounce: 0.7,            // share of its up-down speed the ball keeps off the grass
  skid: 0.8,              // ...and of its forward speed
  ballR: 0.1,             // drawn bigger than a real ball, so it reads on a phone
  // Running
  runSpeed: 7.2,          // m/s
  accel: 12,              // how quickly a player starts and stops
  autoAfterMs: 350,       // after you let go of the stick, auto-run takes over again
  backRoom: 2.4,          // how far behind the baseline a player goes for a deep ball (further and their feet leave the screen)
  volleyZone: 7,          // closer to the net than this, a player cuts the ball off in the air (a volley)...
  volleyStep: 2.6,        // ...when it passes within this many metres of them
  // The swing: ms off the moment the ball reaches you
  earlyMs: 230,           // earlier than this: too early, a practice swing (swing again)
  lateMs: 170,            // later than this: it got past you
  perfectMs: 45,          // this close: a POWER shot
  reach: 1.8,             // the ball must pass this close to your side (metres)...
  reachH: 3.1,            // ...and below this height
  smashH: 2.05,           // hit above this and it's a smash
  swingCdMs: 260,         // one swing every this many ms
  driveSpeed: [15, 25],   // m/s: a mistimed drive, a perfect one
  smashSpeed: 27,
  lobMs: 1900,            // a lob's time in the air
  // Serving: tap to toss, tap again at the top of the toss
  tossV: 6.2,             // m/s up
  servePerfectMs: 70, serveWindowMs: 430,
  serveSpeed: [15, 27],   // m/s: a weak serve, a perfect one
  tossFallMs: 800,        // a toss nobody hits is taken again after it falls this long
  groundGraceMs: 220,     // the host waits this long after a second bounce for a remote player's hit
  // Bots
  botSpeed: 0.92,         // share of the run speed
  botReactMs: 260,        // a bot starts running this long after the shot
  botTimingMs: 62,        // spread of a bot's timing error (bigger = more mistakes)
  botFastPenaltyMs: 40,   // ...plus this much against a fast ball
  botLob: 0.15,           // chance a bot lobs (doubled when someone is at the net)
  botVolley: 0.8,         // chance a bot up at the net goes for a ball it could volley
  sendMs: 80,             // my player ~12 times a second
  botSendMs: 80,          // the bots, the same
  attractDoubles: true,   // the preview plays doubles
  board: "longest-rally",
};
const SIDES = [{ name: "Near", color: "#ff7a45" }, { name: "Far", color: "#3d8bff" }];
const COLORS = ["#ff5d8f", "#ffd23f", "#3ee6d8", "#b388ff", "#7cf29a", "#ff9f1c", "#ffffff", "#5aa8ff"]; // each player's shirt
const BOT_NAMES = ["Topspin Tess", "Volley Vic", "Lob Lou", "Slice Sam"]; // bot "b1" is Topspin Tess
const SKINS = ["#f1c9a5", "#c68a5a", "#8d5a3b", "#e8b48a", "#5e3a24"];
const PT_NAMES = ["0", "15", "30", "40"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'rally-court',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
/** Am I the host? Never in the first 0.7s after this tab wakes from a freeze (fresh state arrives first). */
const isHost = () => performance.now() >= host.quietUntil && livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch
/** The host's clock: it writes `clk` 4 times a second; we keep the smallest delay seen lately. */
const clock = { off: 0, samples: [], last: null };
function noteHostClock() {
  const w = S.shared.clk;
  if (typeof w !== "number" || w === clock.last) return;
  clock.last = w;
  const now = performance.now();
  clock.samples.push({ at: now, d: w - Date.now() });
  while (clock.samples.length && now - clock.samples[0].at > 4000) clock.samples.shift();
  clock.off = Math.max(...clock.samples.map((s) => s.d));
}
const hostNow = () => Date.now() + (net.offline || isHost() ? 0 : clock.off);
/** The host-clock time of an input event, measured from the event itself (not from when we got round to it). */
const eventHostTime = (e) => hostNow() - Math.max(0, performance.now() - (e && e.timeStamp > 0 ? e.timeStamp : performance.now()));

// ── BALL ────────────────────────────────────────────────────────────────────────────
// Court coordinates in metres: x across, z along the court, y up. Side 0 plays at z > 0 (the near
// end), side 1 at z < 0. A flight f = {x, y, z, vx, vy, vz, t0} (t0 on the host's clock, ms) is all
// anyone needs: the bounces, the net and the ball's place at any moment follow from it.
const G = CONFIG.gravity, R = CONFIG.ballR, L = CONFIG.halfL, SW = CONFIG.singlesW, DW = CONFIG.doublesW, SL = CONFIG.serviceL, NET_H = CONFIG.netH;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const r2 = (v) => Math.round(v * 100) / 100;
const isBot = (id) => /^b\d$/.test(id || "");
const sideSign = (team) => (team === 0 ? 1 : -1);       // which end a side plays at (+z or -z)
const rightSign = (team) => (team === 0 ? 1 : -1);      // a player's right hand, in x (side 0 faces -z)
const halfW = (g) => (g && g.dbl ? DW : SW);
const segCache = new WeakMap();
/** A flight cut into pieces between bounces: segments [{t0, t1, x, y, z, vx, vy, vz, roll}] and events [{k: "b" bounce | "n" net, t, x, z}]. */
function pieces(f) {
  let out = segCache.get(f);
  if (out) return out;
  const segs = [], ev = [];
  let s = { t0: f.t0, x: f.x, y: f.y, z: f.z, vx: f.vx, vy: f.vy, vz: f.vz }, netDone = false;
  for (let i = 0; i < 6; i++) {
    const tg = (s.vy + Math.sqrt(Math.max(0, s.vy * s.vy + 2 * G * (s.y - R)))) / G; // seconds to the grass
    let tn = Infinity;
    if (!netDone && s.vz) { const t = -s.z / s.vz; if (t > 1e-4 && t < tg && s.y + s.vy * t - 0.5 * G * t * t < NET_H + R * 0.5 && Math.abs(s.x + s.vx * t) < DW + 0.9) tn = t; }
    if (tn < Infinity) { // into the net: it drops back on the hitter's side
      const yn = s.y + s.vy * tn - 0.5 * G * tn * tn, x = s.x + s.vx * tn;
      segs.push({ ...s, t1: s.t0 + tn * 1000 }); ev.push({ k: "n", t: s.t0 + tn * 1000, x, z: 0, y: yn });
      s = { t0: s.t0 + tn * 1000, x, y: yn, z: -Math.sign(s.vz) * 0.08, vx: s.vx * 0.2, vy: Math.min(0, s.vy - G * tn) * 0.3, vz: -s.vz * 0.06 };
      netDone = true; continue;
    }
    segs.push({ ...s, t1: s.t0 + tg * 1000 });
    const x = s.x + s.vx * tg, z = s.z + s.vz * tg, vy = -(s.vy - G * tg) * CONFIG.bounce;
    ev.push({ k: "b", t: s.t0 + tg * 1000, x, z });
    s = { t0: s.t0 + tg * 1000, x, y: R, z, vx: s.vx * CONFIG.skid, vy, vz: s.vz * CONFIG.skid };
    if (vy < 0.5) break;
  }
  segs.push({ ...s, vy: 0, y: R, t1: Infinity, roll: 1 });
  out = { segs, ev, b: ev.filter((e) => e.k === "b") };
  segCache.set(f, out); return out;
}
/** Where flight f is at host time T. */
function flightPos(f, T) {
  const { segs } = pieces(f);
  let s = segs[0];
  for (const q of segs) if (T >= q.t0) s = q;
  const e = Math.max(0, (T - s.t0) / 1000), m = s.roll ? (1 - Math.exp(-e * 0.8)) / 0.8 : e; // a rolling ball slows down
  return { x: s.x + s.vx * m, y: s.roll ? R : s.y + s.vy * e - 0.5 * G * e * e, z: s.z + s.vz * m, vy: s.roll ? 0 : s.vy - G * e };
}
/** The first moment (host ms, after `after`) the ball crosses the line z = zLine, or null. */
function crossTime(f, zLine, after) {
  for (const s of pieces(f).segs) {
    if (s.roll || !s.vz) continue;
    const t = s.t0 + ((zLine - s.z) / s.vz) * 1000;
    if (t >= s.t0 && t <= s.t1 && t >= after) return t;
  }
  return null;
}

    arm.rotation.set(-1.3, lerp(-1.9, 1.4, k), 0); rk.rotation.set(0, 0, lerp(-0.5, 0.4, k));
    u.rig.rotation.y = lerp(-0.6, 0.5, k);
  } else { arm.rotation.set(-0.7 - leg * 0.3, -0.5, 0); rk.rotation.set(0, 0, -0.3); u.rig.rotation.y *= 0.85; }
}
/** The ring round my feet closes as the ball reaches me: swing when it meets the inner circle. */
function drawTimingRing(g, T) {
  const team = teamOf(g, net.sessionId), B = shotNow();
  let show = false;
  if (!ATTRACT && team >= 0 && g.phase === "rally" && B && B.f && B.team !== team && me.hitN !== B.n) {
    const tc = crossTime(B.f, me.z, T - 50);
    const spot = incomingSpot(g);
    if (tc !== null && tc - T < 1400 && spot) {
      show = true;
      const left = Math.max(0, tc - T), sc = 1 + left / 260;
      timingRing.position.set(me.x, 0.03, me.z); timingRing.scale.setScalar(sc);
      timingRing.material.color.set(left < CONFIG.perfectMs ? "#7cf29a" : "#e4ff3c"); timingRing.material.opacity = clamp(1.2 - left / 1400, 0.25, 1);
      spotMark.position.set(spot.x, 0.025, spot.z);
    }
  }
  timingRing.visible = spotMark.visible = show;
}
function aimCamera(g, dt) {
  const team = teamOf(g, net.sessionId), side = team >= 0 ? sideSign(team) : 1, a = camera.aspect, tall = a < 1 ? 1 - a : 0;
  const mine = team >= 0 ? me : null;
  const fx = mine ? clamp(mine.x * 0.3, -2.5, 2.5) : 0;
  tmpV.set(fx, 10.5 + tall * 8, side * (26.5 + tall * 6)); tmpL.set(fx * 0.4, 0, side * (2.5 + tall * 1.5));
  const k = 1 - Math.exp(-dt * 3);
  camPos.lerp(tmpV, k); camLook.lerp(tmpL, k);
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(v0.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, 0));
  camera.lookAt(camLook);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
let board = null, boardFor = -1, msgUntil = 0, dropped = false;
const startedAt = performance.now();
function say(text, sub, color, ms) {
  $("msg").innerHTML = `<span style="color:${color}">${esc(text)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}`;
  msgUntil = performance.now() + ms;
}
/** "15", "40", "AD" (or tiebreak numbers) for side t. */
function pointLabel(g, t) {
  if (g.tb) return String(g.pts[t]);
  const a = g.pts[t], b = g.pts[1 - t];
  if (a >= 3 && b >= 3) return CONFIG.noAd ? "40" : a > b ? "AD" : a < b ? "" : "40";
  return PT_NAMES[Math.min(3, a)];
}
let introFor = -1;
function hud(g, now) {
  const T = hostNow(), team = teamOf(g, net.sessionId);
  if (g.phase === "intro" && introFor !== g.id) { introFor = g.id; say("PLAY!", `${g.dbl ? "Doubles" : "Singles"} · first to ${CONFIG.gamesToWin} games`, "#e4ff3c", CONFIG.introMs); }
  $("msg").classList.toggle("on", now < msgUntil);
  for (const t of [0, 1]) {
    $("nm" + t).textContent = sideName(g, t); $("nm" + t).style.color = team === t ? "#e4ff3c" : "#fff";
    $("gm" + t).textContent = g.games[t]; $("pt" + t).textContent = pointLabel(g, t);
    $("srv" + t).className = g.phase !== "over" && serveTeam(g) === t ? "srv" : "";
  }
  const deuce = !g.tb && CONFIG.noAd && g.pts[0] >= 3 && g.pts[1] >= 3;
  $("tag").textContent = g.phase === "over" ? "FINAL" : g.tb ? `TIEBREAK · FIRST TO ${CONFIG.tiebreakTo}` : deuce ? "DEUCE · NEXT POINT WINS" : `FIRST TO ${CONFIG.gamesToWin} GAMES${g.fault ? " · 2ND SERVE" : ""}`;
  const fb = me.fb && now - me.fb.at < 1000 ? me.fb : null;
  $("timing").classList.toggle("on", !!fb);
  if (fb) $("timing").innerHTML = `<span style="color:${fb.color}">${esc(fb.t)}</span><small>${esc(fb.s)}</small>`;
  if (ATTRACT) { for (const id of ["sb", "hint", "net", "meter", "stick", "acts", "over"]) $(id).hidden = true; $("net").textContent = ""; return; }
  $("stick").hidden = $("acts").hidden = !touchUI || team < 0;
  // the serve meter while my toss is up
  const s = shotNow(), myToss = g.phase === "serve" && g.srv === net.sessionId && s && s.kind === "toss" && s.by === net.sessionId && me.hitN !== s.n;
  $("meter").hidden = !myToss;
  if (myToss) { const span = 2 * (tossApex(s.f) - s.f.t0); $("meter").querySelector("b").style.left = `${clamp((T - s.f.t0) / span, 0, 1) * 100}%`; $("meter").querySelector("i").style.width = `${(2 * CONFIG.servePerfectMs / span) * 220}px`; }
  // what to do now
  const serving = g.phase === "serve" && g.srv === net.sessionId, swingKey = touchUI ? "SWING" : "Space";
  let hint;
  if (team < 0) hint = ["WATCHING", "Both sides are full: you'll get a spot when one opens."];
  else if (serving) hint = ["YOUR SERVE", s && s.kind === "toss" ? `${swingKey} again at the top of the toss!` : `${swingKey} to toss the ball up${touchUI ? "" : " · ← → aim wide or down the middle"}`];
  else if (now - startedAt < 14000 || g.phase === "intro") hint = ["HOW TO PLAY", `You run to the ball by yourself. ${swingKey} as it reaches the inner ring: early goes cross-court, late goes down the line, on time is POWER. ${touchUI ? "LOB" : "K"} lobs.`];
  else hint = null;
  $("hint").hidden = !hint;
  if (hint) $("hint").innerHTML = `<b>${esc(hint[0])}</b>${esc(hint[1])}`;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the match" : ""}`;
  // the results card
  const card = g.phase === "over" && T > g.at - CONFIG.resultsMs + 1800;
  $("over").hidden = !card;
  if (!card) return;
  const won = team >= 0 && g.win === team;
  $("winner").textContent = won ? "You win!" : `${sideName(g, g.win)} win${g.teams[g.win].length > 1 ? "" : "s"}!`;
  $("winner").style.color = won ? "#e4ff3c" : "#fff";
  $("final").textContent = `${g.games[0]}–${g.games[1]} · longest rally ${g.best || 0} shots`;
  const rows = g.teams.flat().map((id) => ({ id, s: (g.st || {})[id] || [0, 0], t: teamOf(g, id) }));
  $("stats").innerHTML = `<tr><th>Player</th><th>Winners</th><th>Aces</th></tr>` + rows.map(({ id, s, t }) =>
    `<tr class="${id === net.sessionId ? "me" : ""}"><td><i style="background:${colorOf(g, id)}"></i>${esc(id === net.sessionId ? "You" : nameOf(id))}</td><td>${s[0]}</td><td>${s[1]}</td></tr>`).join("");
  $("again").hidden = team < 0;
  $("again").textContent = myReady === g.id ? "Waiting for the others…" : "Play again";
  $("next").textContent = `Next match in ${Math.max(0, Math.ceil((g.at - T) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(team >= 0 ? g.best || 0 : 0); }
}
function showBoard(best) {
  const list = $("board");
  if (!board) { list.innerHTML = `<li class="note">Leaderboards need a connection.</li>`; return; }
  list.innerHTML = `<li class="note">Loading…</li>`;
  (best > 0 ? board.submit(best).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} shots</span></li>`).join("") : `<li class="note">No rallies yet. Start one.</li>`;
  }).catch(() => { list.innerHTML = `<li class="note">Couldn't load the leaderboard.</li>`; });
}
$("again").onclick = () => { const g = game(); if (g && g.phase === "over") { myReady = g.id; net.me.set("rdy", g.id); } };
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. Bots take what's left. */
function fixColor() {
  if (!Object.entries(S.entities.players || {}).some(([id, p]) => id < net.sessionId && p.c === myColor)) return;
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set();
const stick = { id: null, x: 0, y: 0, cx: 0, cy: 0 }; // the touch stick: x right, y up (-1..1)
/** [x right, y forward] from the keys or the stick. */
function myInput() {
  const kx = (keys.has("arrowright") || keys.has("d") ? 1 : 0) - (keys.has("arrowleft") || keys.has("a") ? 1 : 0);
  const ky = (keys.has("arrowup") || keys.has("w") ? 1 : 0) - (keys.has("arrowdown") || keys.has("s") ? 1 : 0);
  return kx || ky ? [kx, ky] : [stick.x, stick.y];
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); unlockAudio();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  keys.add(k);
  if (e.repeat) return;
  if (k === " " || k === "j" || k === "enter") swing(e, e.shiftKey);
  if (k === "k" || k === "l") swing(e, true);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); if (e.pointerType === "mouse") swing(e, e.button === 2 || e.shiftKey); });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
const stickEl = $("stick");
stickEl.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); stick.id = e.pointerId; const r = stickEl.getBoundingClientRect(); stick.cx = r.left + r.width / 2; stick.cy = r.top + r.height / 2; stickEl.setPointerCapture(e.pointerId); moveStick(e); });
stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stick.id) moveStick(e); });
for (const ev of ["pointerup", "pointercancel"]) stickEl.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; stickEl.firstElementChild.style.transform = ""; } });
function moveStick(e) {
  let dx = (e.clientX - stick.cx) / 50, dy = (e.clientY - stick.cy) / 50; const d = Math.hypot(dx, dy);
  if (d > 1) { dx /= d; dy /= d; }
  stick.x = Math.abs(dx) > 0.2 ? dx : 0; stick.y = Math.abs(dy) > 0.2 ? -dy : 0;
  stickEl.firstElementChild.style.transform = `translate(${dx * 36}px, ${dy * 36}px)`;
}
function tap(el, fn) { el.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); el.classList.add("on"); fn(e); }); for (const ev of ["pointerup", "pointercancel"]) el.addEventListener(ev, () => el.classList.remove("on")); }
tap($("bSwing"), (e) => swing(e, false));
tap($("bLob"), (e) => swing(e, true));
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastReal = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = performance.now(); // a freeze is measured on the real clock (the frame's own time can be stale after one)
  if (real - lastReal > 1000) { host.wasHost = false; host.last = null; host.lastBall = null; host.quietUntil = real + 700; } // woke up: wait for fresh state, then adopt it
  lastReal = real;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  noteHostClock();
  syncViews(dt);
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(dt, g, now);
    drawWorld(g, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(g, now); }
  }
  tickParts(dt); tickCrowd(dt, now);
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (m, from) => { if (isHost() && m) applyHit(from, m); });
  net.on("toss", (m, from) => { if (isHost()) applyToss(from, m || {}); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { introMs: 300, botServeMs: 250, pointMs: 1000, faultMs: 600, resultsMs: 1500, gamesToWin: 99, botTimingMs: 30, botFastPenaltyMs: 0 });
  if (ATTRACT || TEST) window.__rc = () => { const g = game(), B = ballState(); return { g, B, host: isHost(), me: { x: me.x, z: me.z, id: net.sessionId }, bots: [...host.bots.values()].map((b) => [b.id, r2(b.x), r2(b.z)]), off: clock.off,
    swing: (lob) => swing({ timeStamp: performance.now() }, !!lob), tc: () => { const s = shotNow(); return s && s.f ? crossTime(s.f, me.z, s.f.t0 + 80) - hostNow() : null; } }; }; // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
